name: Build

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  # En PRs solo se valida: corre tests y buildea la imagen, sin publicarla.
  pull_request:
    branches: [main]

jobs:
  # 1) Tests con coverage y verificación de que el build compila
  test:
    runs-on: ubuntu-latest
    env:
      # Opcional: si existe el secret, el coverage se sube a Codecov
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Con package-lock.json usa npm ci (instalación exacta); sin él, npm install.
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tests (con coverage)
        run: npm run test:coverage

      - name: Guardar reporte de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/

      - name: Subir coverage a Codecov (solo si existe el secret)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Build de producción
        run: npm run build

  # 2) Calidad de código: análisis estático con oxlint (informativo, no frena el pipeline)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: oxlint
        continue-on-error: true
        run: npx --yes oxlint@1 src/

  # 3) Construye la imagen. En PRs solo se valida; en push a main (o tag) se publica en Docker Hub.
  #    No se publica nada si los tests fallan.
  docker:
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decidir si se publica
        id: check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::notice::Pull request: se construye la imagen para validarla, pero no se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::warning::Faltan los secrets DOCKERHUB_USERNAME y/o DOCKERHUB_TOKEN. Se construye la imagen pero no se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Login en Docker Hub
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: rama / git tag / PR + un tag inmutable sha-<commit> (el que se despliega
      # y permite volver a cualquier commit) + latest en main.
      - name: Extraer metadata de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/cartelera-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Render solo acepta imágenes linux/amd64
          push: ${{ steps.check.outputs.publish == 'true' }}
          # Vite "hornea" esta URL en el bundle al buildear. Por defecto apunta al
          # backend local; para Render se define la variable del repo VITE_API_BASE_URL
          # (Settings, Secrets and variables, Actions, Variables) con la URL pública de la API.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8081/api' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deja a mano, en el resumen del run, el tag para usar en "Deploy Render".
      - name: Resumen
        if: steps.check.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${TAGS}"
            echo '```'
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              echo "Para desplegar: **Actions, Deploy Render**, tag \`sha-${GITHUB_SHA}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) Tests (Vitest) y verificación de que el build de producción compila
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build


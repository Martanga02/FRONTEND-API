name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) Tests (Vitest) y verificación de que el build de producción compila
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build

  # 2) Si los tests pasan en main, construye y sube la imagen a Docker Hub
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Vite hornea esta URL en el bundle al buildear (ver Dockerfile)
          build-args: |
            VITE_API_BASE_URL=http://localhost:8081/tp_parte3/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cartelera-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cartelera-frontend:${{ github.sha }}
